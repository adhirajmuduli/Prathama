<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Trendsmapp data-flow architecture</title>
  <desc id="desc">Flow from validated uploads through FastAPI into GPU visualization and deterministic scientific export paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#466057"/></marker>
    <style>.box{fill:#fff;stroke:#087f5b;stroke-width:2}.gpu{fill:#e6fcf5}.cpu{fill:#e7f5ff}.store{fill:#fff4e6}.t{font:700 18px system-ui;fill:#15251f}.s{font:14px system-ui;fill:#466057}.a{stroke:#466057;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#f4f7f5"/>
  <rect class="box" x="35" y="195" width="170" height="105" rx="12"/><text class="t" x="120" y="230" text-anchor="middle">CSV / Excel</text><text class="s" x="120" y="258" text-anchor="middle">or demo workbook</text><text class="s" x="120" y="280" text-anchor="middle">+ GeoJSON boundary</text>
  <rect class="box" x="265" y="165" width="210" height="165" rx="12"/><text class="t" x="370" y="205" text-anchor="middle">FastAPI ingestion</text><text class="s" x="370" y="235" text-anchor="middle">size and extension</text><text class="s" x="370" y="258" text-anchor="middle">schema and finite values</text><text class="s" x="370" y="281" text-anchor="middle">UTC timestamps</text><text class="s" x="370" y="304" text-anchor="middle">session-scoped files</text>
  <rect class="box store" x="525" y="35" width="200" height="105" rx="12"/><text class="t" x="625" y="75" text-anchor="middle">Data-entry store</text><text class="s" x="625" y="103" text-anchor="middle">SQLite / PostgreSQL</text><text class="s" x="625" y="125" text-anchor="middle">transactional upserts</text>
  <rect class="box gpu" x="525" y="190" width="245" height="120" rx="12"/><text class="t" x="647" y="225" text-anchor="middle">Scientific surface path</text><text class="s" x="647" y="253" text-anchor="middle">IDW / Gaussian KDE</text><text class="s" x="647" y="276" text-anchor="middle">server CPU grids</text><text class="s" x="647" y="298" text-anchor="middle">boundary-masked PNG</text>
  <rect class="box cpu" x="525" y="370" width="245" height="120" rx="12"/><text class="t" x="647" y="405" text-anchor="middle">Animation path</text><text class="s" x="647" y="433" text-anchor="middle">IDW / KDE surfaces</text><text class="s" x="647" y="456" text-anchor="middle">fixed range + time blending</text><text class="s" x="647" y="478" text-anchor="middle">server-side CPU</text>
  <rect class="box gpu" x="835" y="190" width="300" height="120" rx="12"/><text class="t" x="985" y="225" text-anchor="middle">Interactive display</text><text class="s" x="985" y="253" text-anchor="middle">stations + PNG overlay</text><text class="s" x="985" y="276" text-anchor="middle">image fallback + capture</text><text class="s" x="985" y="298" text-anchor="middle">MapLibre WebGL2 optional</text>
  <rect class="box cpu" x="835" y="370" width="300" height="120" rx="12"/><text class="t" x="985" y="405" text-anchor="middle">Publication artifacts</text><text class="s" x="985" y="433" text-anchor="middle">PNG surfaces / MP4 animation</text><text class="s" x="985" y="456" text-anchor="middle">deterministic method metadata</text><text class="s" x="985" y="478" text-anchor="middle">reviewer download</text>
  <path class="a" d="M205 247 H265"/><path class="a" d="M475 205 C500 205 500 88 525 88"/><path class="a" d="M475 247 H525"/><path class="a" d="M475 290 C500 290 500 430 525 430"/><path class="a" d="M770 250 H835"/><path class="a" d="M770 430 H835"/>
</svg>
