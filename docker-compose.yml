name: trendsmapp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-trendsmapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)} -d ${POSTGRES_DB:-trendsmapp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-store:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-store-init:
    image: minio/mc:latest
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
       mc alias set local http://object-store:9000 ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)} ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)} &&
      mc mb --ignore-existing local/${TRENDSMAPP_S3_BUCKET:-trendsmapp} &&
      mc anonymous set none local/${TRENDSMAPP_S3_BUCKET:-trendsmapp}
      "

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-environment
      TRENDSMAPP_ENVIRONMENT: ${TRENDSMAPP_ENVIRONMENT:-development}
      TRENDSMAPP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-trendsmapp}
      TRENDSMAPP_OBJECT_STORE_BACKEND: s3
      TRENDSMAPP_S3_BUCKET: ${TRENDSMAPP_S3_BUCKET:-trendsmapp}
      TRENDSMAPP_S3_ENDPOINT_URL: http://object-store:9000
      # MinIO on a compose hostname needs path-style addressing; virtual-hosted
      # style would try <bucket>.object-store:9000, which does not resolve.
      TRENDSMAPP_S3_FORCE_PATH_STYLE: "true"
      TRENDSMAPP_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      TRENDSMAPP_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
      TRENDSMAPP_LOG_LEVEL: ${TRENDSMAPP_LOG_LEVEL:-info}
      TRENDSMAPP_LOG_JSON: "true"
      # List-valued variables are JSON in the environment.
      TRENDSMAPP_CORS_ALLOW_ORIGINS: ${TRENDSMAPP_CORS_ALLOW_ORIGINS:-["http://localhost:3000"]}
      TRENDSMAPP_TRUSTED_HOSTS: ${TRENDSMAPP_TRUSTED_HOSTS:-["localhost","127.0.0.1","api","testserver"]}

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "trendsmapp.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    environment: *backend-environment
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    init: true
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["trendsmapp", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    environment: *backend-environment
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  object-store-data:
