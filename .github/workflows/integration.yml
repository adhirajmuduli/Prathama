name: integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "true"
  UV_VERSION: "0.13.5"

jobs:
  postgres:
    name: backend against PostgreSQL and S3-compatible storage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trendsmapp
          POSTGRES_PASSWORD: trendsmapp
          POSTGRES_DB: trendsmapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trendsmapp -d trendsmapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # No MinIO service container: Docker Hub rate-limits anonymous pulls.
      # Instead the job runs a moto S3 server (pip package) on port 5000.
      moto:
        image: python:3.13-slim-bookworm
        ports:
          - 5000:5000
        options: >-
          --entrypoint ""
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        env:
          AWS_ACCESS_KEY_ID: trendsmapp
          AWS_SECRET_ACCESS_KEY: trendsmapp-secret
        command: >-
          sh -c "pip install --quiet 'moto[server]' && python -m moto.server -H 0.0.0.0 -p 5000"
    env:
      TRENDSMAPP_ENVIRONMENT: development
      TRENDSMAPP_DATABASE_URL: postgresql+asyncpg://trendsmapp:trendsmapp@localhost:5432/trendsmapp
      TRENDSMAPP_OBJECT_STORE_BACKEND: s3
      TRENDSMAPP_S3_BUCKET: trendsmapp
      TRENDSMAPP_S3_ENDPOINT_URL: http://localhost:5000
      TRENDSMAPP_S3_REGION: us-east-1
      TRENDSMAPP_S3_ACCESS_KEY_ID: trendsmapp
      TRENDSMAPP_S3_SECRET_ACCESS_KEY: trendsmapp-secret
      TRENDSMAPP_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: trendsmapp
      AWS_SECRET_ACCESS_KEY: trendsmapp-secret
      TRENDSMAPP_CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
      TRENDSMAPP_TRUSTED_HOSTS: '["localhost","127.0.0.1","testserver"]'
      TRENDSMAPP_LOG_LEVEL: warning
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: install dependencies
        run: uv sync --frozen --all-groups
      - name: wait for the object store to accept connections
        run: |
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5000) 2>/dev/null; then
              echo "moto S3 is accepting connections"
              exit 0
            fi
            sleep 2
          done
          echo "moto S3 did not become ready" >&2
          exit 1
      - name: create the object-store bucket
        run: |
          uv run --with boto3 python - <<'PY'
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="http://localhost:5000",
              aws_access_key_id="trendsmapp",
              aws_secret_access_key="trendsmapp-secret",
              region_name="us-east-1",
          )
          existing = [b["Name"] for b in s3.list_buckets()["Buckets"]]
          if "trendsmapp" not in existing:
              s3.create_bucket(Bucket="trendsmapp")
          print("bucket trendsmapp ready")
          PY
      - name: apply migrations
        run: uv run alembic upgrade head
      - name: migration rolls back one revision and reapplies
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - name: run the full backend suite against PostgreSQL and S3
        run: uv run pytest -q --no-header -p no:cacheprovider
      - name: API and worker start against the services
        run: |
          uv run python -c "
          import asyncio
          from trendsmapp.settings import get_settings
          from trendsmapp.persistence.database import create_engine_for_settings
          from trendsmapp.storage.factory import create_object_store
          async def check():
              settings = get_settings()
              engine = create_engine_for_settings(settings)
              store = create_object_store(settings)
              store.put_bytes('uploads/smoke/probe.bin', b'ok', content_type='application/octet-stream')
              assert store.get_bytes('uploads/smoke/probe.bin') == b'ok'
              await engine.dispose()
          asyncio.run(check())
          print('storage round-trip against S3-compatible store: ok')
          "
