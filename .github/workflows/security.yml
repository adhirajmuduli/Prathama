name: security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: export the resolved dependency set
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
      - name: audit the resolved dependency set
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r requirements-audit.txt --progress-spinner off
      - uses: actions/upload-artifact@v7
        with:
          name: backend-audit-requirements
          path: backend/requirements-audit.txt
          if-no-files-found: error

  container-scan:
    name: backend container scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - name: build the image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: trendsmapp-backend:scan
      - name: scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trendsmapp-backend:scan
          format: sarif
          output: trivy-results.sarif
          # Python dependencies are gated at zero-tolerance by pip-audit in
          # ci.yml; for the OS layer we fail on CRITICAL only and accept
          # unfixed HIGHs until the base image ships fixes (tracked via the
          # SARIF upload to CodeQL). Secrets are covered by gitleaks above.
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: upload the scan result
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  sbom:
    name: software bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - name: build the image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: trendsmapp-backend:sbom
      - name: generate the bill of materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trendsmapp-backend:sbom
          format: cyclonedx
          output: sbom-backend.cdx.json
      - name: store the bill of materials
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom
          path: sbom-backend.cdx.json
          if-no-files-found: error
