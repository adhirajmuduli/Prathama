[build]
base = "frontend"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "22.17.0"
PNPM_VERSION = "11.22.0"
NPM_FLAGS = "--version"
# The built-in secrets scanner must not fail the deploy on false positives:
# Netlify's own plugin installs land in .netlify/, vendored deps in
# node_modules, .env.example only contains placeholders, and .next/ inlines
# non-secret env defaults by design.
SECRETS_SCAN_OMIT_PATHS = ".netlify/**, **/node_modules/**, .next/**, .env.example, pnpm-lock.yaml, package-lock.json, uv.lock, requirements.lock.txt, backend/testdata/**, frontend/tests/fixtures/**"
# Only true credentials are scanned: every non-secret configuration key is
# omitted, because their values (origins, CRS codes, limits, "trendsmapp")
# legitimately appear in source and build output.
SECRETS_SCAN_OMIT_KEYS = "POSTGRES_DB, POSTGRES_USER, MINIO_ROOT_USER, BACKEND_API_ORIGIN, NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_TURNSTILE_SITE_KEY, TRENDSMAPP_ENVIRONMENT, TRENDSMAPP_OBJECT_STORE_BACKEND, TRENDSMAPP_LOCAL_STORAGE_ROOT, TRENDSMAPP_S3_BUCKET, TRENDSMAPP_S3_ENDPOINT_URL, TRENDSMAPP_S3_REGION, TRENDSMAPP_S3_FORCE_PATH_STYLE, TRENDSMAPP_DATABASE_URL, TRENDSMAPP_API_TIMEOUT_MS, TRENDSMAPP_LOG_LEVEL, TRENDSMAPP_LOG_JSON, TRENDSMAPP_ANALYSIS_CRS, TRENDSMAPP_CORS_ALLOW_ORIGINS, TRENDSMAPP_TRUSTED_HOSTS, TRENDSMAPP_REQUEST_MAX_BODY_BYTES, TRENDSMAPP_UPLOAD_MAX_BYTES, TRENDSMAPP_INGESTION_ACCEPT_CACHED_FORMULA_VALUES, TRENDSMAPP_WORKER_POLL_INTERVAL_SECONDS, TRENDSMAPP_WORKER_HEARTBEAT_INTERVAL_SECONDS, TRENDSMAPP_WORKER_STALE_AFTER_SECONDS, CONTACT_FROM_EMAIL, CONTACT_TO_EMAIL, CONTACT_RATE_LIMIT_WINDOW_MS, CONTACT_RATE_LIMIT_IP_PER_WINDOW, CONTACT_RATE_LIMIT_EMAIL_PER_WINDOW, CONTACT_IDEMPOTENCY_TTL_SECONDS"

[dev]
command = "pnpm run dev"
targetPort = 3000
port = 3000
autoLaunch = false

[context.production.environment]
NODE_ENV = "production"

[context.deploy-preview.environment]
NODE_ENV = "production"

# Netlify provisions the Next.js adapter automatically. The frontend never
# serves scientific output: it renders artifacts produced by the backend and
# links to them through the API.
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  # script/frame/connect include challenges.cloudflare.com for the Turnstile
  # widget on /contact; img/connect include https: so artifacts served by the
  # cross-origin API container render in the dataset explorer.
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https: https://challenges.cloudflare.com; font-src 'self' data:; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "no-store"

[[redirects]]
from = "/home"
to = "/"
status = 301
force = true
