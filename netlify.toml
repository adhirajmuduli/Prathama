[build]
base = "frontend"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "22.17.0"
PNPM_VERSION = "11.22.0"
NPM_FLAGS = "--version"
# The built-in secrets scanner must not fail the deploy on false positives:
# Netlify's own plugin installs land in .netlify/, vendored deps in
# node_modules, and .env.example only contains placeholder values.
SECRETS_SCAN_OMIT_PATHS = ".netlify/**, **/node_modules/**, .env.example, pnpm-lock.yaml, package-lock.json, uv.lock, requirements.lock.txt, backend/testdata/**, frontend/tests/fixtures/**"
# Non-secret configuration keys (values, not credentials) that appear in
# .env.example and the build environment are excluded from key matching.
SECRETS_SCAN_OMIT_KEYS = "TRENDSMAPP_ENVIRONMENT, TRENDSMAPP_OBJECT_STORE_BACKEND, TRENDSMAPP_LOCAL_STORAGE_ROOT, TRENDSMAPP_S3_BUCKET, TRENDSMAPP_S3_ENDPOINT_URL, TRENDSMAPP_S3_REGION, TRENDSMAPP_S3_FORCE_PATH_STYLE, TRENDSMAPP_DATABASE_URL, TRENDSMAPP_API_TIMEOUT_MS, TRENDSMAPP_LOG_LEVEL, NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_TURNSTILE_SITE_KEY"

[dev]
command = "pnpm run dev"
targetPort = 3000
port = 3000
autoLaunch = false

[context.production.environment]
NODE_ENV = "production"

[context.deploy-preview.environment]
NODE_ENV = "production"

# Netlify provisions the Next.js adapter automatically. The frontend never
# serves scientific output: it renders artifacts produced by the backend and
# links to them through the API.
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  # script/frame/connect include challenges.cloudflare.com for the Turnstile
  # widget on /contact; img/connect include https: so artifacts served by the
  # cross-origin API container render in the dataset explorer.
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https: https://challenges.cloudflare.com; font-src 'self' data:; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "no-store"

[[redirects]]
from = "/home"
to = "/"
status = 301
force = true
